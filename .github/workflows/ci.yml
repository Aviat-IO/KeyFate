name: CI

on:
  push:
    branches: [main, develop, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Lint and format check
        run: bun run lint
      - name: Svelte and TypeScript check
        run: bun run check

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run tests
        run: bun run test

  migration:
    name: Migration Smoke
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.9-alpine3.22
        env:
          POSTGRES_USER: keyfate
          POSTGRES_PASSWORD: keyfate
          POSTGRES_DB: keyfate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keyfate -d keyfate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://keyfate:keyfate@127.0.0.1:5432/keyfate
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Run generated migrations
        run: bun run db:migrate:production
      - name: Run PostgreSQL concurrency, fencing, and upgrade tests
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: >-
          bun test
          scripts/postgres-concurrency.test.ts
          scripts/migration-compatibility.test.ts

  build:
    name: Build
    runs-on: ubuntu-24.04
    needs: [lint-typecheck, test, migration]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install frozen dependencies
        run: bun install --frozen-lockfile
      - name: Build production server
        run: bun run build

  docker:
    name: Docker & Runtime Smoke
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build pinned production image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t keyfate:test .
      - name: Verify non-root app-only runtime and pruned dependencies
        run: |
          test "$(docker run --rm --entrypoint id keyfate:test -u)" = "1001"
          test "$(docker image inspect keyfate:test --format '{{json .Config.Cmd}}')" = '["bun","run","build/index.js"]'
          docker run --rm --entrypoint sh keyfate:test -c '
            set -eu
            for package in vite @sveltejs/vite-plugin-svelte @sveltejs/adapter-node typescript eslint prettier drizzle-kit vitest; do
              test ! -e "node_modules/$package"
            done
            for package in @sveltejs/kit svelte drizzle-orm postgres; do
              test -e "node_modules/$package"
            done
          '
      - name: Start runtime without migrations
        run: >-
          docker run -d --name keyfate-smoke -p 3000:3000
          -e PORT=3000
          -e CRON_ENABLED=false
          -e AUTH_SECRET=test-auth-secret-at-least-32-characters
          -e AUTH_TRUST_HOST=true
          -e ORIGIN=http://127.0.0.1:3000
          -e ENCRYPTION_KEY=YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
          -e SENDGRID_API_KEY=SG.test
          keyfate:test
      - name: Verify process liveness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health/live; then
              exit 0
            fi
            sleep 1
          done
          docker logs keyfate-smoke
          exit 1
      - name: Verify readiness fails closed without PostgreSQL
        run: test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/health/ready)" = "503"
      - name: Stop runtime
        if: always()
        run: docker rm -f keyfate-smoke || true
